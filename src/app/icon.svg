      <stop offset="100%" stop-color="#1449D6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1449D6" flood-opacity="0.35"/>
